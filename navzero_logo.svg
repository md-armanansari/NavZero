<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070F1B" />
      <stop offset="50%" stop-color="#0B192C" />
      <stop offset="100%" stop-color="#03070E" />
    </linearGradient>

    <!-- Neon Glow Cyan Gradient -->
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F5D4" />
      <stop offset="100%" stop-color="#00B4D8" />
    </linearGradient>

    <!-- Emerald Radar Gradient -->
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00FF87" />
      <stop offset="100%" stop-color="#60EFFF" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Subtle Radar Sweep Gradient -->
    <radialGradient id="radarSweep" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00F5D4" stop-opacity="0.15" />
      <stop offset="70%" stop-color="#00F5D4" stop-opacity="0.03" />
      <stop offset="100%" stop-color="#00F5D4" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Deep Military Space Background -->
  <rect width="800" height="800" fill="url(#bgGrad)" rx="40" />

  <!-- Outer Radar Track Ring -->
  <circle cx="400" cy="360" r="240" fill="none" stroke="#1E3E62" stroke-width="2" stroke-dasharray="6 8" opacity="0.6" />
  <circle cx="400" cy="360" r="200" fill="url(#radarSweep)" stroke="url(#cyanGrad)" stroke-width="3" opacity="0.8" />
  <circle cx="400" cy="360" r="140" fill="none" stroke="#00B4D8" stroke-width="1.5" stroke-dasharray="4 6" opacity="0.4" />
  <circle cx="400" cy="360" r="70" fill="none" stroke="#00F5D4" stroke-width="1.5" opacity="0.6" />

  <!-- Target Crosshair Reticle Lines (Optical Sensor Lock) -->
  <line x1="160" y1="360" x2="230" y2="360" stroke="#00F5D4" stroke-width="3" stroke-linecap="round" />
  <line x1="570" y1="360" x2="640" y2="360" stroke="#00F5D4" stroke-width="3" stroke-linecap="round" />
  <line x1="400" y1="120" x2="400" y2="190" stroke="#00F5D4" stroke-width="3" stroke-linecap="round" />
  <line x1="400" y1="530" x2="400" y2="600" stroke="#00F5D4" stroke-width="3" stroke-linecap="round" />

  <!-- Corner Brackets (Optical Frame Lock) -->
  <path d="M 270 260 L 250 260 L 250 280" fill="none" stroke="#00FF87" stroke-width="3" stroke-linecap="round" />
  <path d="M 530 260 L 550 260 L 550 280" fill="none" stroke="#00FF87" stroke-width="3" stroke-linecap="round" />
  <path d="M 250 440 L 250 460 L 270 460" fill="none" stroke="#00FF87" stroke-width="3" stroke-linecap="round" />
  <path d="M 550 440 L 550 460 L 530 460" fill="none" stroke="#00FF87" stroke-width="3" stroke-linecap="round" />

  <!-- Central Trishul & Stealth UAV Delta Wing (Geometric Vector) -->
  <!-- Left Wing / Trident Prong -->
  <path d="M 400 360 L 320 280 L 340 370 L 375 390 Z" fill="#00B4D8" opacity="0.85" />
  <path d="M 400 360 L 320 280 L 340 370" fill="none" stroke="#00F5D4" stroke-width="2.5" />

  <!-- Right Wing / Trident Prong -->
  <path d="M 400 360 L 480 280 L 460 370 L 425 390 Z" fill="#00B4D8" opacity="0.85" />
  <path d="M 400 360 L 480 280 L 460 370" fill="none" stroke="#00F5D4" stroke-width="2.5" />

  <!-- Central Spearhead (Trishul Center Spear & Stealth Fighter Nose) -->
  <polygon points="400,210 425,360 400,385 375,360" fill="url(#emeraldGrad)" filter="url(#glow)" />
  <polygon points="400,210 412,360 400,380 388,360" fill="#FFFFFF" opacity="0.9" />

  <!-- Center Optical Eye / Core Pixel Lock -->
  <circle cx="400" cy="360" r="14" fill="#070F1B" stroke="#00FF87" stroke-width="3.5" />
  <circle cx="400" cy="360" r="5" fill="#00F5D4" filter="url(#glow)" />

  <!-- Brand Typography -->
  <!-- "NAVZERO" Title -->
  <text x="400" y="680" font-family="'Helvetica Neue', 'Arial', sans-serif" font-weight="900" font-size="52" fill="#FFFFFF" text-anchor="middle" letter-spacing="14">
    NAV<tspan fill="#00F5D4">ZERO</tspan>
  </text>

  <!-- Subtitle: Defense Tagline -->
  <text x="400" y="722" font-family="'Helvetica Neue', 'Arial', sans-serif" font-weight="600" font-size="16" fill="#8E9AA8" text-anchor="middle" letter-spacing="6">
    AUTONOMOUS DEFENSE OPTICS
  </text>

  <!-- Founder Badge -->
  <text x="400" y="750" font-family="'Helvetica Neue', 'Arial', sans-serif" font-weight="400" font-size="11" fill="#4B6584" text-anchor="middle" letter-spacing="3">
    FOUNDED BY RAUNAK KUMAR | PROJECT TRISHUL
  </text>
</svg>
